name: Skills Lint

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test
        run: python3 scripts/lint_skills.py --selftest
      - name: Lint skills/*/SKILL.md
        run: python3 scripts/lint_skills.py
